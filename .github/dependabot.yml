# Atualizações de dependência, propostas como pull request.
#
# As versões do backend e as actions do CI são fixadas à mão, e ficavam onde
# estavam até alguém lembrar de olhar: em 21/11/2026 uma auditoria achou 27
# vulnerabilidades conhecidas em duas bibliotecas (pyjwt e python-multipart)
# cujas correções já existiam havia meses.
#
# Uma vez por semana, agrupado: um PR por ecossistema com as atualizações
# menores, em vez de um PR por pacote. Correções de segurança vêm fora do
# grupo, sozinhas e na hora. Nada é mesclado sozinho — o CI roda no PR e quem
# decide é quem revisa.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      backend:
        update-types: [minor, patch]

  # APP: atualizações de versão PAUSADAS (o limite 0 abaixo).
  #
  # O app é construído com o Flutter fixado no CI (3.38.10, Dart 3.10.9 — ver
  # docs/11-convencoes.md). O Dependabot resolve as versões com o Dart mais
  # novo e propõe pacotes que esse Dart não instala: o `pub get` do CI falha e
  # o PR nunca passa. Tentou-se excluir pacote por pacote e não adianta — cada
  # rodada traz outro: image_picker 1.2.4 e cupertino_icons 2.0 na primeira,
  # shared_preferences 2.5.6 na segunda, e um só dentro do grupo derruba as
  # atualizações boas que vinham junto.
  #
  # Para religar: suba o Flutter fixado (ci.yml e deploy-web.yml) e troque o
  # limite de volta para 5. O bloco continua aqui, e não apagado, para a pausa
  # ficar à vista e as correções de SEGURANÇA continuarem saindo — o limite 0
  # desliga só as atualizações de versão.
  - package-ecosystem: pub
    directory: /app_flutter
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      app:
        update-types: [minor, patch]
    ignore:
      # flutter_map 8 passa no analyze e nos testes e QUEBRA o mapa: visto no
      # navegador em 24/11/2026, o atlas desenha pinos e rastros sobre um fundo
      # vazio, sem telha nenhuma, com um erro não tratado no console. A versão
      # 7 no mesmo ambiente mostra o mapa. Vale também depois de religar: fica
      # de fora até alguém fazer a migração de propósito — e olhar o resultado,
      # que é o que o CI não faz.
      - dependency-name: flutter_map
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
