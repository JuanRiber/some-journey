name: some_journey
description: "Some Journey — atlas pessoal de memórias e jornadas (Flutter)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.9

dependencies:
  flutter:
    sdk: flutter

  # Grafemas (iniciais do avatar sem cortar acento/emoji ao meio). Já vem na
  # árvore do Flutter; declarado por ser usado diretamente.
  characters: ^1.4.0
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  http_parser: ^4.0.2
  shared_preferences: ^2.3.2
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  image_picker: ^1.1.2
  geolocator: ^14.0.3
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Relógio falso nos testes de timeout: sem ele, exercer um teto de 75s
  # custaria 75s de relógio real. Vem junto do flutter_test, mas é declarado
  # aqui de propósito — depender do que é transitivo quebra sem aviso no dia
  # em que o flutter_test deixar de trazê-lo.
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/first-class-art.jpg
    # Licenças das fontes embutidas (todas SIL OFL 1.1): viajam junto delas,
    # como a própria licença exige de quem as redistribui.
    - assets/fonts/OFL-Fraunces.txt
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-IBMPlexMono.txt

  # As três vozes do design system, embutidas porque fonte de sistema não existe
  # em todo lugar: na web o motor não enxerga as fontes da máquina, e "Georgia",
  # "Inter" e "Menlo" caíam todas na mesma sans — serifa, corpo e selo saíam
  # numa letra só. Só os pesos que o design system usa: cada arquivo a mais é
  # carregado antes do primeiro quadro na web.
  fonts:
    # Serifa dos títulos. Instâncias estáticas no tamanho óptico 24, o meio da
    # escala de títulos.
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Regular.ttf
        - asset: assets/fonts/Fraunces-Italic.ttf
          style: italic
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-SemiBoldItalic.ttf
          weight: 600
          style: italic
    # Sans da interface. Sem 700: os poucos pedidos de negrito caem no 600.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    # Mono dos overlines, selos e numerais. O 700 fica porque a aba selecionada
    # se distingue da outra pelo peso.
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
