name: some_journey
description: "Some Journey — atlas pessoal de memórias e jornadas (Flutter)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.9

dependencies:
  flutter:
    sdk: flutter

  # Grafemas (iniciais do avatar sem cortar acento/emoji ao meio). Já vem na
  # árvore do Flutter; declarado por ser usado diretamente.
  characters: ^1.4.0
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  http_parser: ^4.0.2
  shared_preferences: ^2.3.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/first-class-art.jpg
