# Blueprint do Render para o backend (deploy via Docker).
# Segredos ficam como sync:false — você os define no painel do Render, NÃO aqui.
services:
  - type: web
    name: some-journey-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    # Mesma região do banco (Supabase em East US / North Virginia). O Render não
    # tem região no Brasil; com API e banco lado a lado, cada consulta custa ~1 ms
    # e o tester paga uma única ida aos EUA por request — com o banco em São
    # Paulo e a API aqui, CADA consulta cruzaria o continente. A região não muda
    # depois de criado o serviço (só recriando).
    region: virginia
    # Só publica depois do CI verde no commit — o mesmo critério do deploy web
    # (.github/workflows/deploy-web.yml). O padrão do Render é publicar a cada
    # push, inclusive o que a suíte reprovou.
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: REGISTRATION_OPEN
        value: "false"
      - key: SUPABASE_BUCKET
        value: memories
      # O Session pooler do Supabase grátis aceita ~15 conexões. Um processo
      # (scripts/start.sh) × (5 + 5) = 10, sobrando folga para os scripts
      # (seed, reset) rodados da máquina de quem administra. Subir
      # WEB_CONCURRENCY multiplica este teto: reduza o pool junto.
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      # --- definir no painel (Environment) ---
      # Postgres do Supabase: a string do SESSION pooler (a conexão direta é só
      # IPv6 e o Render não alcança), com o prefixo trocado para
      # postgresql+psycopg:// — ver docs/12-deploy.md.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY        # gere um forte, novo (não o de dev)
        sync: false
      - key: SUPABASE_URL          # https://<ref>.supabase.co
        sync: false
      - key: SUPABASE_SERVICE_KEY  # service_role key
        sync: false
      - key: CORS_ALLOWED_ORIGINS  # a URL do Cloudflare Pages, ex.: https://some-journey.pages.dev
        sync: false
      - key: TRUSTED_HOSTS         # o host do Render, ex.: some-journey-api.onrender.com
        sync: false
      # --- opcionais: vazias, o recurso fica desligado e o resto funciona ---
      - key: GOOGLE_CLIENT_ID      # ids da web, Android e iOS, separados por vírgula (sem: /auth/google responde 503)
        sync: false
      - key: SMTP_HOST             # sem SMTP_HOST + SMTP_FROM o e-mail de recuperação de senha não sai
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM             # remetente, ex.: Some Journey <nao-responda@seu-dominio>
        sync: false
